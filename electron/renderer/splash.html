<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nova — starting…</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e0e0e0;
      }
      .splash {
        text-align: center;
        padding: 40px;
      }
      .logo {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: #7c3aed;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        font-weight: 700;
        color: white;
        margin: 0 auto 20px;
        box-shadow: 0 0 40px rgba(124, 58, 237, 0.4);
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      p {
        font-size: 13px;
        color: #888;
      }
      .spinner {
        margin: 20px auto 0;
        width: 24px;
        height: 24px;
        border: 2px solid #333;
        border-top-color: #7c3aed;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="logo">N</div>
      <h1>Nova</h1>
      <p>Starting up…</p>
      <div class="spinner"></div>
    </div>
  </body>
</html>
